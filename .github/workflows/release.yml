# Phát hành: make release VERSION=X.Y.Z && git push --follow-tags
# Push tag vX.Y.Z → build bản Ubuntu (.deb) và macOS (universal) → GitHub Release
# kèm install.sh. Lệnh cài một dòng (README) tải các file này.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  # Bản phát hành kiểm tra bản mới trên repo này (src/useUpdate.ts).
  VITE_GITHUB_REPO: ${{ github.repository }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/check-version.sh "$GITHUB_REF_NAME"
      - name: Gói build của Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: cargo test --workspace
      - run: npx tauri build --bundles deb
      - name: Đặt tên file như install.sh cần
        run: |
          mkdir -p dist-release
          cp target/release/bundle/deb/*.deb "dist-release/redmine-logtime_${GITHUB_REF_NAME#v}_amd64.deb"
      # Chữ ký cho cập nhật trong app; thiếu secret thì bỏ qua (app dùng lệnh cài).
      - name: Ký cho cập nhật trong app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci/sign-update.sh dist-release/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-release/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/check-version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - run: scripts/package-macos.sh
      - name: Ký cho cập nhật trong app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci/sign-update.sh target/publish/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/publish/

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh assets/install.sh
          # "Có gì mới": phần thân của tag (NOTES_FILE khi chạy release.sh).
          # checkout không giữ nội dung tag có chú thích, nên lấy lại tag.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          WHATS_NEW="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          # latest.json cho cập nhật trong app, khi các file đã được ký.
          NOTES="$WHATS_NEW" scripts/ci/latest-json.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" assets
          if [ -n "$WHATS_NEW" ]; then printf '## Có gì mới\n\n%s\n\n' "$WHATS_NEW" > notes.md; else : > notes.md; fi
          cat >> notes.md <<NOTES
          Cài hoặc cập nhật trên macOS và Ubuntu/Debian:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/HEAD/scripts/install.sh | bash
          \`\`\`
          NOTES
          rm -f assets/*.sig
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Redmine Logtime ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
