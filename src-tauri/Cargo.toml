[package]
name = "redmine-logtime"
version.workspace = true
edition.workspace = true

[lib]
name = "redmine_logtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
logtime-core.workspace = true
logtime-engine.workspace = true
ai-bridge.workspace = true
google-chat.workspace = true
redmine-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
log = "0.4"
tokio = { workspace = true, features = ["time"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
