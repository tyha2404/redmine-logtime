<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Redmine Logtime. Four workdays as columns: three filled to the daily
    quota (the green line), today still filling. Redmine's colours: the
    header blue fading to the top-bar navy, the flash-notice green. macOS grid: 824px tile
    inside the 1024px canvas, with the standard drop shadow.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#628db6"/>
      <stop offset="1" stop-color="#3e5b76"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1d2b38" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Days -->
  <rect x="288" y="356" width="76" height="372" rx="20" fill="#ffffff"/>
  <rect x="412" y="356" width="76" height="372" rx="20" fill="#ffffff"/>
  <rect x="536" y="356" width="76" height="372" rx="20" fill="#ffffff"/>
  <rect x="660" y="356" width="76" height="372" rx="20" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="660" y="552" width="76" height="176" rx="20" fill="#ffffff"/>

  <!-- Daily quota -->
  <rect x="256" y="318" width="512" height="20" rx="10" fill="#a8e2a4"/>
</svg>
