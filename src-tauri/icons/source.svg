<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Redmine Logtime app icon: the Redmine logo mark recoloured in the app's
    accent blue (#116699), darker at the base and lighter at the top as in
    the original red, on a white tile.

    Based on the Redmine logo, Copyright (C) 2009 Martin Herr, licensed under
    CC BY-SA 2.5 (https://creativecommons.org/licenses/by-sa/2.5/), from
    https://github.com/edavis10/redmine_logo. This adaptation is shared under
    the same licence. Redmine Logtime is not an official Redmine product.

    macOS grid (Apple's Big Sur+ icon template): 824px tile at 100,100 in
    the 1024px canvas, corner radius 185.4px (22.37%) with continuous
    ("squircle") corners, 60% smoothing; standard drop shadow below. Regenerate the icon files: see docs/development.md.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1d2b38" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z" fill="url(#tile)"/>
  </g>
  <path d="M628.26 101.5c102.99 0 154.49 0 193.83 20.04a183.9 183.9 0 0 1 80.37 80.37c20.04 39.34 20.04 90.84 20.04 193.83L922.5 628.26c0 102.99 0 154.49 -20.04 193.83a183.9 183.9 0 0 1 -80.37 80.37c-39.34 20.04 -90.84 20.04 -193.83 20.04L395.74 922.5c-102.99 0 -154.49 0 -193.83 -20.04a183.9 183.9 0 0 1 -80.37 -80.37c-20.04 -39.34 -20.04 -90.84 -20.04 -193.83L101.5 395.74c0 -102.99 0 -154.49 20.04 -193.83a183.9 183.9 0 0 1 80.37 -80.37c39.34 -20.04 90.84 -20.04 193.83 -20.04Z" fill="none" stroke="#3e5b76" stroke-opacity="0.12" stroke-width="3"/>

  <!-- The Redmine mark (original 77.4 × 52.8 units), scaled 7× and centred -->
  <g transform="translate(241 220) scale(7)" fill-rule="evenodd">
    <polygon fill="#0b4f78" points="0,69.55 16.8,69.55 18,55.149 2.399,51.55"/>
    <polygon fill="#0e5c8b" points="3,49.149 18,52.75 21.601,40.149 9,33.55"/>
    <polygon fill="#116699" points="10.2,31.149 22.2,37.75 31.8,31.149 22.8,20.949"/>
    <polygon fill="#0b4f78" points="77.399,69.55 60.601,69.55 59.399,55.149 75,51.55"/>
    <polygon fill="#0e5c8b" points="74.399,49.149 59.399,52.75 55.8,40.149 68.399,33.55"/>
    <polygon fill="#116699" points="67.2,31.149 55.2,37.75 45.601,31.149 54.601,20.949"/>
    <polygon fill="#2a7fb4" points="25.8,19.149 34.8,29.949 43.2,29.949 51,19.149 43.2,16.75 34.589,16.75"/>
  </g>
</svg>
