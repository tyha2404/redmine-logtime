# Redmine Logtime: kiểm tra mỗi lần push, phát hành khi push tag vX.Y.Z.
#
# Phát hành:  make release VERSION=0.2.0 && git push --follow-tags
#   1. build:linux   build .deb (Ubuntu 22.04, amd64) và đưa lên Package Registry
#   2. build:macos   build .app universal (chỉ chạy khi đặt biến MACOS_RUNNER_TAG
#                    là tag của một runner macOS; không có thì build trên máy Mac
#                    bằng `make publish-macos`)
#   3. release       đăng install.sh, tạo GitLab Release và in lệnh cài một dòng
#
# Lệnh cài trên máy mới (in ở log job release):
#   curl -fsSL $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/redmine-logtime/latest/install.sh | bash

stages: [check, build, release]

variables:
  PACKAGE: redmine-logtime
  PACKAGE_REGISTRY: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/redmine-logtime
  NODE_VERSION: "22.12.0"
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: always
  npm_config_cache: ${CI_PROJECT_DIR}/.npm
  # Nhúng vào app để mục "Về ứng dụng" kiểm tra và hướng dẫn cập nhật.
  VITE_GITLAB_URL: ${CI_SERVER_URL}
  VITE_GITLAB_PROJECT: ${CI_PROJECT_ID}

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.linux:
  image: ubuntu:22.04
  cache:
    key:
      files: [Cargo.lock, package-lock.json]
    paths: [.cargo/registry, .cargo/git, target, .npm]
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      build-essential pkg-config curl wget file ca-certificates xz-utils patchelf
      libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      > /dev/null
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm ci --no-audit --no-fund

check:
  extends: .linux
  stage: check
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - npx tsc --noEmit
    - cargo test --workspace
    - for f in scripts/*.sh; do bash -n "$f"; done
    - for f in scripts/ci/*.sh; do sh -n "$f"; done

build:linux:
  extends: .linux
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - scripts/ci/check-version.sh "$CI_COMMIT_TAG"
    - VERSION="${CI_COMMIT_TAG#v}"
    - npx tsc --noEmit
    - cargo test --workspace
    - npx tauri build --bundles deb
    - DEB="$(ls target/release/bundle/deb/*.deb | head -1)"
    - ASSET="${PACKAGE}_${VERSION}_amd64.deb"
    - >
      curl -fsS --retry 3 -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$DEB"
      "$PACKAGE_REGISTRY/$VERSION/$ASSET"

build:macos:
  stage: build
  tags: [$MACOS_RUNNER_TAG]
  rules:
    - if: $CI_COMMIT_TAG && $MACOS_RUNNER_TAG
  script:
    - scripts/ci/check-version.sh "$CI_COMMIT_TAG"
    - command -v node >/dev/null || brew install node
    - command -v cargo >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
    - export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
    - GITLAB_TOKEN="" CI_UPLOAD=1 scripts/publish-macos.sh "$CI_COMMIT_TAG"

release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:linux
    - job: build:macos
      optional: true
  script:
    - apk add --no-cache -q curl jq
    - scripts/ci/release.sh
